<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodado · Consultas</title>
<style>
  :root { --fondo: #f4f5f2; --tinta: #1d2420; --suave: #5d6660; --acento: #1f7a4d; --borde: #d6dbd4; --error: #b3361f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.sub { margin: 0 0 24px; color: var(--suave); }
  form { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 22px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  input, textarea, select { font: inherit; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; color: inherit; }
  textarea { min-height: 140px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 8px; background: var(--acento); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  .estado { margin: 0; font-size: 14px; }
  .estado.ok { color: var(--acento); }
  .estado.mal { color: var(--error); }
  small { color: var(--suave); font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>Rodado</h1>
  <p class="sub">Taller y tienda de bicicletas · Escribinos tu consulta y te respondemos por mail.</p>
  <form id="consulta">
    <label>Nombre <input id="nombre" name="nombre" required maxlength="80" autocomplete="name"></label>
    <label>Mail <input id="email" name="email" type="email" required maxlength="120" autocomplete="email"></label>
    <label>Tema
      <select id="asunto" name="asunto">
        <option>Consulta sobre un service o precio</option>
        <option>Pedir turno</option>
        <option>Problema con mi bicicleta</option>
        <option>Garantía o reclamo</option>
        <option>Pagos y envíos</option>
        <option>Otra consulta</option>
      </select>
    </label>
    <label>Tu consulta <small>No envíes DNI, datos de tarjeta ni contraseñas.</small>
      <textarea id="mensaje" name="mensaje" required minlength="5" maxlength="4000"></textarea>
    </label>
    <button type="submit" id="enviar">Enviar consulta</button>
    <p class="estado" id="estado" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
  // Pegá acá la URL de producción del nodo Webhook de n8n («Production URL»).
  const WEBHOOK = 'https://lb99.app.n8n.cloud/webhook/rodado-consulta';

  const form = document.getElementById('consulta');
  const estado = document.getElementById('estado');
  const boton = document.getElementById('enviar');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    boton.disabled = true;
    estado.className = 'estado';
    estado.textContent = 'Enviando…';
    const datos = Object.fromEntries(new FormData(form));
    try {
      const r = await fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
      if (!r.ok) throw new Error('El servidor respondió ' + r.status);
      estado.className = 'estado ok';
      estado.textContent = 'Listo: recibimos tu consulta. Te respondemos por mail en unos minutos.';
      form.reset();
    } catch (err) {
      estado.className = 'estado mal';
      estado.textContent = 'No se pudo enviar (' + err.message + '). Probá de nuevo o escribinos por mail.';
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
